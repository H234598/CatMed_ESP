name: Host contracts and firmware
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  qlty:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Complete native Qlty scans and fail-closed issue delta
        env:
          QLTY_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
          QLTY_TELEMETRY: "off"
        run: tools/ci.sh qlty
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # official v1
        with:
          esp_idf_version: v6.1
          target: esp32c3
          extra_docker_args: -e CI=true -e IDF_PATH=/opt/esp/idf
          command: >-
            apt-get update && apt-get install -y libssl-dev zlib1g-dev python3-pil nodejs &&
            python -m pip install Pillow==13.0.0 jsonschema "Jinja2>=2.10.3" aiohttp==3.13.5 &&
            python3 tests/check_ci_mbedtls_framework_binding.py &&
            python3 tests/check_ci_host_mbedtls_lvgl.py &&
            python3 tools/prepare_ci_host_submodules.py &&
            tools/ci.sh dependencies c3 && tools/ci.sh host
  firmware:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: c3
            target: esp32c3
          - board: c6
            target: esp32c6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # official v1
        with:
          esp_idf_version: v6.1
          target: ${{ matrix.target }}
          extra_docker_args: -e CI=true
          command: apt-get update && apt-get install -y python3-pil && python -m pip install Pillow==13.0.0 && tools/ci.sh firmware ${{ matrix.board }}
